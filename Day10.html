<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{

            display: grid;
            
            grid-template-columns: repeat(3 ,1fr);
            grid-template-rows: 50px 50px;
            background-color: brown;
            padding: 10px;
            
            column-gap: 25px;
            row-gap: 50px;
            
            
        }
        .container div{
            background-color: bisque;
            border: 1px solid brown;
            padding: 10px;
            text-align: center;
        }
        

        .layout{
            display: grid;
            grid-template-areas:
             "header header header"
            "sidebar content content"
            "footer footer footer";
            grid-template-columns: 1fr 3fr 1fr ;
            grid-template-rows: 80px 400px 60px;
            border: 5px solid violet;
            margin-top: 20px;
            
        }
        .header{
            grid-area:header;
            background-color: aqua;
            text-align: center;
        }
        .sidebar{
            grid-area: sidebar;
            background-color: rgb(134, 180, 88);
        }
        .content{
            grid-area: content;
            background-color: cornflowerblue;
            text-align: center;

        }
        .footer{
            grid-area: footer;
            background-color: coral;
        }
        .cardgrid{
            display: grid;
            padding: 10px;   
            gap: 20px; 
            grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
        }
        .card{
            display: flex;
           color: bisque;
            justify-content: center;
            background-color: darkslategray;
            height: 200px;
            align-items: center;
            border-radius: 10px;
            
        }
        .img_gal {
             display: grid;
             grid-template-columns: repeat(4, 1fr);
             grid-auto-rows: 150px;
             gap: 10px;
             padding: 10px;
             border: 2px solid black;
            }
        .imgs {
            background-color: blanchedalmond;
            overflow: hidden;
            border: 2px solid black;
            border-radius: 10px;
        }
        .imgs img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}


.imgs:nth-child(1) {
    grid-column: span 2;
    grid-row: span 2;
}

  
.imgs:nth-child(6) {
    grid-column: span 2;
}

         .layout-2 {
    display: grid;

    grid-template-columns: 200px repeat(3, 1fr);
    grid-template-rows: 70px 120px 1fr;

    grid-template-areas:
        "sidebar header header header"
        "sidebar users sales revenue"
        "sidebar activity reports reports";

    gap: 10px;
    min-height: 500px;

    border: 5px solid rgb(116, 60, 116);
    margin-top: 20px;
    padding: 10px;
}


.sidebar-1 {
    grid-area: sidebar;
    background-color: brown;
}


.header-2 {
    grid-area: header;
    background-color: aquamarine;
}


.users {
    grid-area: users;
    background-color: lightblue;
}

.sales {
    grid-area: sales;
    background-color: lightgreen;
}

.revenue {
    grid-area: revenue;
    background-color: lightpink;
}


.sidecontent-1 {
    grid-area: activity;
    background-color: cadetblue;
}

.content-1 {
    grid-area: reports;
    background-color: darkcyan;
}


.layout-2 > div {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    font-weight: bold;
}
      

    </style>


</head>

    <div class="container">

        <div class="two">2</div>
        <div class="three"> 3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>

    <div class="layout">
    <div class="grid-item header"> header</div>
    <div class=" grid-item sidebar">Sidebar</div>
    <div class="grid-item content">Maincontent</div>
    <div class=" grid-item footer">Footer</div>
    </div>

        <div class="card"> card-2</div>
        <div class="card">card-3</div>
        <div class="card">card-4</div>
    </div>
